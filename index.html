<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LEMON App Store</title>
<style>
:root{--bg:#fff;--surface:#f4f4f6;--ink:#1d1d1f;--muted:#6e6e73;--line:#e5e5ea;--accent:#f5c400;--accent-ink:#1d1d1f;--soft:#fff3b0;--btn-ink:#7a5c00;--danger:#d70015;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0c0e;--surface:#1c1c1e;--ink:#f5f5f7;--muted:#98989d;--line:#2c2c2e;--accent:#ffd60a;--soft:#3a3100;--btn-ink:#ffd60a;--danger:#ff6b7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c0c0e;--surface:#1c1c1e;--ink:#f5f5f7;--muted:#98989d;--line:#2c2c2e;--accent:#ffd60a;--soft:#3a3100;--btn-ink:#ffd60a;--danger:#ff6b7a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);z-index:10}
.bar{display:flex;gap:12px;align-items:center;padding:10px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem;letter-spacing:.04em;margin-right:auto}
.lg{width:38px;height:38px;object-fit:contain}
.field{padding:11px 16px;border:0;border-radius:12px;background:var(--surface);width:100%}
.search{flex:1 1 240px;max-width:340px;width:auto;border-radius:10px;padding:9px 14px}
.btn{border:0;background:var(--soft);color:var(--btn-ink);font-weight:700;padding:7px 20px;border-radius:999px;min-width:80px;text-decoration:none;display:inline-block;text-align:center}
.btn.solid{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
h1{font-size:clamp(2rem,6vw,2.6rem);line-height:1.1;letter-spacing:-.025em;margin:28px 0 4px;font-weight:800}
.sub{color:var(--muted);margin:0 0 18px;border-bottom:1px solid var(--line);padding-bottom:18px}
h2{font-size:1.25rem;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:0 48px;padding-bottom:40px}
.card{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.icon{flex:none;width:76px;height:76px;border-radius:22%;object-fit:cover;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:1.8rem;color:var(--btn-ink);box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.meta{flex:1;min-width:0}
.meta b{display:block;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{display:block;color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{margin:22px 0 28px;border-radius:28px;padding:34px 38px;background:linear-gradient(135deg,#ffe45c,#f5b800);color:#1d1d1f;display:flex;align-items:center;justify-content:space-between;gap:20px;overflow:hidden}
.hero h1{margin:0 0 10px;font-size:clamp(1.9rem,6vw,2.9rem)}
.hero p{margin:0;max-width:36ch;font-size:1.05rem;opacity:.8}
.hero-img{width:clamp(88px,22vw,170px);height:auto;flex:none;transform:rotate(8deg);filter:drop-shadow(0 12px 14px rgba(0,0,0,.2))}
.head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px}
.head h2{margin:0}.head span{color:var(--muted);font-size:.9rem}
.empty{padding:48px 0 70px;color:var(--muted);text-align:center}
.empty img{width:84px;opacity:.9;margin-bottom:10px}
.foot{padding:26px 20px 40px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);text-align:center}
@media (max-width:560px){.hero{padding:24px}}
.admin{background:var(--surface);border-radius:22px;padding:22px;margin:0 0 28px}
.admin .field{background:var(--bg)}
.form{display:grid;gap:12px;grid-template-columns:auto 1fr;align-items:start}
.pick{width:96px;height:96px;border-radius:22%;border:2px dashed var(--line);background:var(--bg);display:grid;place-items:center;text-align:center;font-size:.8rem;color:var(--muted);cursor:pointer;overflow:hidden;padding:0}
.pick img{width:100%;height:100%;object-fit:cover}
.fields{display:grid;gap:10px}
.msg{min-height:1.4em;color:var(--muted);font-size:.9rem;margin:10px 0 0}
.msg.err{color:var(--danger)}
.list{margin-top:20px;display:grid;gap:0}
.list .icon{width:48px;height:48px;font-size:1.2rem}
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(10,10,12,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.lcard{width:min(380px,100%);background:var(--bg);border-radius:28px;padding:30px 28px 24px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.lmark{width:64px;height:64px;object-fit:contain;margin-bottom:6px}
.lcard h2{margin:0 0 4px;font-size:1.5rem;letter-spacing:-.02em}
.lsub{margin:0 0 20px;color:var(--muted)}
.lcard label{display:block;text-align:left;font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:14px}
.lcard .field{margin-top:6px;color:var(--ink)}
.pwrow{position:relative;display:block}
.pwrow .field{padding-right:68px}
.eye{position:absolute;right:6px;top:12px;border:0;background:none;color:var(--btn-ink);font-weight:700;font-size:.85rem;padding:6px 10px}
.lcard .msg{text-align:left;margin:-4px 0 12px}
.wide{width:100%;padding:13px;font-size:1rem}
.cancel{display:block;margin:12px auto 0;border:0;background:none;color:var(--muted);padding:6px 12px}
.adm-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.adm-top b{font-size:1.15rem}.adm-top span{display:block;color:var(--muted);font-size:.85rem}
[hidden]{display:none!important}
@media (max-width:560px){.form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    <h2 style="margin-top:28px">Change password</h2>
    <div class="fields">
      <input class="field" id="pw1" type="password" placeholder="New password (at least 3 characters)" autocomplete="new-password" aria-label="New password">
      <input class="field" id="pw2" type="password" placeholder="Repeat new password" autocomplete="new-password" aria-label="Repeat new password">
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn solid" id="pwGo">Save password</button></div>
    </div>
    <p class="msg" id="pmsg" role="status"></p>
  </section>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden><img class="mirror" alt=""><p id="emptyTxt"></p></div>
</main>
<footer class="foot wrap">© 2026 LEMON App Store</footer>

<script>
const $=s=>document.querySelector(s);
const API="/api/lemon";
let apps=[],term="",token=null,unlocked=false,iconFile=null,loaded=false,loadErr="";
try{token=sessionStorage.getItem("lemon-token")}catch(e){}
unlocked=!!token;
function setToken(t){token=t;unlocked=!!t;try{t?sessionStorage.setItem("lemon-token",t):sessionStorage.removeItem("lemon-token")}catch(e){}}
async function call(body){
  let r;
  try{r=await fetch(API,{method:"POST",headers:Object.assign({"Content-Type":"application/json"},token?{Authorization:"Bearer "+token}:{}),body:JSON.stringify(body)})}
  catch(e){throw new Error("No connection. Check your internet and try again.")}
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&body.action!=="login"){setToken(null);$("#admin").hidden=true;openLogin();throw new Error(j.error||"Please log in again.")}
  if(!r.ok)throw new Error(j.error||("Error "+r.status));
  return j;
}
function fixLink(v){v=(v||"").trim();if(!v)return"";if(!/^https?:\/\//i.test(v))v="https://"+v;try{return new URL(v).href}catch(e){return""}}
function iconEl(a){
  if(a.icon){const i=document.createElement("img");i.className="icon";i.alt="";i.src=a.icon;return i}
  const d=document.createElement("div");d.className="icon";d.textContent=(a.name||"?")[0].toUpperCase();return d;
}
function card(a,admin){
  const c=document.createElement("div");c.className="card";
  c.appendChild(iconEl(a));
  const m=document.createElement("div");m.className="meta";
  const b=document.createElement("b");b.textContent=a.name;
  m.append(b);
  if(admin){const s=document.createElement("span");s.textContent=a.link.replace(/^https?:\/\//,"");m.append(s)}
  c.appendChild(m);
  if(admin){
    const x=document.createElement("button");x.className="btn danger";x.textContent="Delete";x.dataset.del=a.id;c.appendChild(x);
  }else{
    const o=document.createElement("a");o.className="btn";o.textContent="Open";o.href=a.link;o.target="_blank";o.rel="noopener noreferrer";c.appendChild(o);
  }
  return c;
}
function render(){
  const list=apps.filter(a=>(a.name+" "+a.link).toLowerCase().includes(term));
  $("#grid").replaceChildren(...list.map(a=>card(a,false)));
  $("#count").textContent=list.length?list.length+(list.length===1?" app":" apps"):"";
  const e=$("#empty");
  if(list.length){e.hidden=true}else{
    e.hidden=false;
    $("#emptyTxt").textContent=term?"No apps match that search.":(!loaded?"Loading apps…":(loadErr||"No apps yet. Check back soon."));
  }
  $("#list").replaceChildren(...apps.map(a=>card(a,true)));
}
function say(t,err){const m=$("#msg");m.textContent=t;m.className="msg"+(err?" err":"")}
function note(id,t,err){const m=$(id);m.textContent=t;m.className="msg"+(err?" err":"")}
function toPng(file,n){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();
  i.onload=()=>{const c=document.createElement("canvas");c.width=c.height=n;const x=c.getContext("2d");
    const W=i.naturalWidth||n,H=i.naturalHeight||n,r=Math.min(n/W,n/H),w=W*r,h=H*r;
    x.drawImage(i,(n-w)/2,(n-h)/2,w,h);URL.revokeObjectURL(u);
    res(c.toDataURL("image/png"))};
  i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("That image type is not supported. Use PNG, JPG, WebP or ICO."))};
  i.src=u})}
async function load(){
  try{const r=await fetch(API+"?t="+Date.now(),{cache:"no-store"});const j=await r.json();
    if(!r.ok)throw new Error(j.error||"Could not load apps.");
    apps=(j.apps||[]).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));loadErr=""}
  catch(e){loadErr=e.message||"Could not load apps."}
  loaded=true;render();
}
function showAdmin(){const a=$("#admin");a.hidden=false;a.scrollIntoView({block:"start"})}
function openLogin(){if(unlocked){showAdmin();return}$("#login").hidden=false;note("#lmsg","");setTimeout(()=>$("#lu").focus(),0)}
function closeLogin(){$("#login").hidden=true;$("#lp").value="";if(location.hash==="#admin")history.replaceState(null,"",location.pathname+location.search)}

$("#q").addEventListener("input",e=>{term=e.target.value.trim().toLowerCase();render()});
$("#lform").addEventListener("submit",async e=>{
  e.preventDefault();
  const u=$("#lu").value.trim(),p=$("#lp").value;
  $("#loginGo").disabled=true;note("#lmsg","Checking…");
  try{const j=await call({action:"login",username:u,password:p});setToken(j.token);closeLogin();showAdmin()}
  catch(err){note("#lmsg",err.message,true)}
  $("#loginGo").disabled=false;
});
$("#eye").addEventListener("click",()=>{const f=$("#lp"),sh=f.type==="password";f.type=sh?"text":"password";$("#eye").textContent=sh?"Hide":"Show"});
$("#lcancel").addEventListener("click",closeLogin);
$("#login").addEventListener("click",e=>{if(e.target.id==="login")closeLogin()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#login").hidden)closeLogin()});
let taps=0,tapT;
document.querySelector(".logo").addEventListener("click",()=>{taps++;clearTimeout(tapT);tapT=setTimeout(()=>taps=0,1500);if(taps>=5){taps=0;openLogin()}});
window.addEventListener("hashchange",()=>{if(location.hash==="#admin")openLogin()});
$("#logout").addEventListener("click",()=>{setToken(null);$("#admin").hidden=true});

$("#file").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  iconFile=f;const p=$("#pick");p.replaceChildren();
  const i=document.createElement("img");i.alt="Selected icon";i.src=URL.createObjectURL(f);p.appendChild(i);
});
$("#add").addEventListener("click",async()=>{
  const name=$("#name").value.trim(),link=fixLink($("#link").value);
  if(!iconFile){say("Choose an icon image first.",true);return}
  if(!name){say("Enter the app name.",true);return}
  if(!link){say("Enter a valid link.",true);return}
  $("#add").disabled=true;say("Uploading…");
  try{
    const icon=await toPng(iconFile,192);
    const j=await call({action:"add",name,link,icon});
    apps=j.apps.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));render();
    $("#name").value="";$("#link").value="";iconFile=null;$("#file").value="";
    $("#pick").innerHTML='<span>Upload icon</span>';
    say("App added. It is now live.");
  }catch(err){say("Could not add the app. "+err.message,true)}
  $("#add").disabled=false;
});
$("#list").addEventListener("click",async e=>{
  const id=e.target.dataset&&e.target.dataset.del;if(!id)return;
  const a=apps.find(x=>x.id===id);
  if(!a||!confirm("Delete "+a.name+"?"))return;
  try{const j=await call({action:"delete",id});apps=j.apps.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));render();say("App deleted.")}
  catch(err){say("Could not delete. "+err.message,true)}
});
$("#pwGo").addEventListener("click",async()=>{
  const a=$("#pw1").value,b=$("#pw2").value;
  if(a.length<3){note("#pmsg","Use at least 3 characters.",true);return}
  if(a!==b){note("#pmsg","The two passwords do not match.",true);return}
  try{await call({action:"password",newPassword:a});$("#pw1").value="";$("#pw2").value="";note("#pmsg","Password saved. Use it next time you log in.")}
  catch(err){note("#pmsg","Could not save the password. "+err.message,true)}
});

document.querySelectorAll(".mirror").forEach(i=>i.src=document.querySelector(".lg").src);
if(location.hash==="#admin")openLogin();
render();load();
</script>
</body>
</html>
